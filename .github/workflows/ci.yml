# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-lint:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Reject forbidden paths
        run: |
          forbidden='node_modules|/bin/|vendor/phpunit|vendor/squizlabs'
          if git ls-files | grep -E "$forbidden"; then
            echo "::error::Forbidden paths are tracked in Git"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Build plugin assets
        run: npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, dom, curl, json, libxml, xml, xmlwriter
          tools: composer

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Audit Composer dependencies
        run: composer audit --no-interaction
        continue-on-error: true

      - name: Validate composer.json
        run: composer validate --no-check-publish --no-interaction

      - name: PHPCS (WordPress Coding Standards)
        run: vendor/bin/phpcs

      - name: Required plugin files
        run: |
          test -f aegis.php
          test -f uninstall.php
          test -f index.php
          test -f src/autoload.php
