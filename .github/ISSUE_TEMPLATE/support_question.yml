name: Support/Question
description: Ask a question about the Aegis free plugin.
labels:
  - question
  - support
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Before opening a support request, check the [wiki](https://github.com/aegiswp/plugin/wiki) and [Discussions](https://github.com/aegiswp/plugin/discussions).
        **For bugs**, use the Bug Report template instead.

  - type: textarea
    id: help
    attributes:
      label: What do you need help with?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps you have tried
    validations:
      required: false

  - type: input
    id: wp-version
    attributes:
      label: WordPress Version
    validations:
      required: false

  - type: input
    id: plugin-version
    attributes:
      label: Aegis Plugin Version
    validations:
      required: false

  - type: input
    id: theme-version
    attributes:
      label: Aegis Theme Version
    validations:
      required: false
