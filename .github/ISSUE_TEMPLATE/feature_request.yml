name: Feature Request
description: Suggest an idea for the Aegis free plugin.
labels:
  - "[Type] Feature"
  - triage
body:
  - type: markdown
    attributes:
      value: |
        **Thank you for suggesting an improvement to the Aegis plugin.**
        Theme features belong in [aegiswp/theme](https://github.com/aegiswp/theme); Pro features in [aegiswp/pro](https://github.com/aegiswp/pro).

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Feature scope
      options:
        - Map / Modal blocks
        - Admin dashboard / settings
        - Integrations
        - Conditionals / hooks / snippets
        - Analytics / SEO
        - Patterns
        - Developer tooling / CI
        - Documentation
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you would like
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
    validations:
      required: false
